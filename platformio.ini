; Wspólna baza OTA. Przed zmianą przeczytaj docs/OTA.md i AGENTS.md.
[platformio]
default_envs = esp32-1, esp32-2

[env]
platform = espressif32@8.0.0
board = nodemcu-32s
framework = arduino
board_build.partitions = default.csv
monitor_speed = 115200
lib_deps =
    adafruit/DHT sensor library@1.4.7
extra_scripts = pre:scripts/configure.py
upload_protocol = custom
; Hasło czytane przez wrapper z pliku, nigdy z argumentu polecenia.
upload_command = "$PYTHONEXE" "$PROJECT_DIR/scripts/upload_ota.py" --environment $PIOENV --file "$SOURCE"

[env:esp32-1]

[env:esp32-2]

; Zgodność z wcześniejszą komendą: ta nazwa zawsze wskazuje ESP32-1.
[env:nodemcu-32s]
extends = env:esp32-1
